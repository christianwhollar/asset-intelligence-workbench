[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-intelligence-workbench"
version = "1.0.0"
description = "Real estate operating intelligence from spreadsheets, documents, and reviewable AI briefs"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "openpyxl>=3.1,<4", "pypdf>=6,<7", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brickline = ["*.sql", "web/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
